name: Validate application JavaScript

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  issue_comment:
    types: [created]

permissions:
  contents: read

jobs:
  syntax:
    if: github.event_name != 'issue_comment' || contains(github.event.comment.body, '/validate')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'issue_comment' && format('refs/pull/{0}/merge', github.event.issue.number) || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check Worker module syntax
        run: |
          node --input-type=module --check < worker.js
          node --input-type=module --check < ai-moderator.js
          node --input-type=module --check < workers-ai-client.js
      - name: Test Workers AI adapter
        run: node scripts/test-workers-ai-client.mjs
      - name: Check Mini App inline JavaScript
        run: node scripts/check-inline-scripts.mjs index.html
